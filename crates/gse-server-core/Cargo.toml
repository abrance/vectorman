[package]
name = "gse-server-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gse-proto = { path = "../gse-proto" }
geminio.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
dataplane-core.workspace = true
dataplane-sql.workspace = true
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["fs"] }
ureq = "2"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
gse-agent-core = { path = "../gse-agent-core" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
