name: release-package

on:
  push:
    tags:
      - "v*"

jobs:
  build-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Setup Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          packaging/build-package.sh --version "$VERSION"
          REL="${VERSION#v}"
          echo "PKG_TARBALL=vectorman-${REL}-linux-x86_64.tar.gz" >> "$GITHUB_ENV"

      - name: Create or update GitHub release with package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$PKG_TARBALL" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "$PKG_TARBALL" --clobber
