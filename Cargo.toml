[workspace]
resolver = "2"
members = [
    "crates/dataplane-core",
    "crates/dataplane-file",
    "crates/dataplane-ts",
    "crates/dataplane-log",
    "crates/dataplane-kv",
    "crates/dataplane-sql",
    "crates/dataplane-ingest",
    "crates/dataplane-apm",
    "crates/dataplane-adapter-postgres",
    "crates/dataplane-adapter-mysql",
    "crates/dataplane-adapter-redis",
    "crates/dataplane-adapter-elasticsearch",
    "crates/dataplane-adapter-doris",
    "crates/dataplane-adapter-influxdb",
    "crates/dataplane-adapter-victoriametrics",
    "bins/dataserver",
    "bins/dpc",
    "bins/gse-server",
    "bins/gse-agent",
    "bins/console",
    "bins/vmctl",
    "crates/gse-proto",
    "crates/gse-server-core",
    "crates/gse-agent-core",
    "crates/gse-agent-ebpf",
    "crates/ebpf-abi",
    "crates/vectorman-version",
    "crates/vectorman-metrics",
]
# 内核态程序用 bpfel 目标 + nightly 构建，不能进工作区（否则根目录 cargo build/test 会尝试按主机目标编译它）。
exclude = ["crates/gse-ebpf-programs"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
dataplane-core = { path = "crates/dataplane-core" }
dataplane-file = { path = "crates/dataplane-file" }
dataplane-ts = { path = "crates/dataplane-ts" }
dataplane-log = { path = "crates/dataplane-log" }
dataplane-kv = { path = "crates/dataplane-kv" }
dataplane-sql = { path = "crates/dataplane-sql" }
dataplane-ingest = { path = "crates/dataplane-ingest" }
dataplane-apm = { path = "crates/dataplane-apm" }

gse-proto = { path = "crates/gse-proto" }
gse-server-core = { path = "crates/gse-server-core" }
gse-agent-core = { path = "crates/gse-agent-core" }
gse-agent-ebpf = { path = "crates/gse-agent-ebpf" }
ebpf-abi = { path = "crates/ebpf-abi" }
vectorman-version = { path = "crates/vectorman-version" }
vectorman-metrics = { path = "crates/vectorman-metrics" }

geminio = { git = "https://github.com/singchia/geminio-rs", rev = "ff4363f814398b36c6ddf37b3d9042eb0b1dd802" }

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"

# tsink 0.10.2 的分片 tombstone 存储有「写者换 manifest 并删旧分片 / 读者拿着旧
# manifest 开旧分片」的竞态，读方会拿到 `IO error: No such file or directory`，
# 表现为 `flush worker error: ...` 每几分钟一次、`background_errors_total` 累积、
# `degraded` 常亮、WAL 一直涨（2026-10-08 cloud3 实测）。
#
# 上游 master 还没修；先 pin 到 fork 的修复分支（`load_tombstones` 遇 NotFound 重读
# manifest 重试）。上游合并/发版后删掉这段、回到 crates.io 版本。
#   issue/PR: https://github.com/aidlx/tsink/pull/19
[patch.crates-io]
tsink = { git = "https://github.com/abrance/tsink", rev = "d30c47cdddc68c813c0886f80135c1968d6674ed" }
