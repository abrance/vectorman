# Vectorman server 侧的 K8s 部署（gse-server / dataserver / console）
#
# 形态：三个 Deployment（单副本）+ 各自 Service(NodePort)。数据与前端 dist 走节点 hostPath
# （单节点 k3s，如 cloud3；多节点时再换 local-path/PVC）。
#
# 与二进制安装（install.sh + systemd）的差异：
#   - 进程工作目录 = /app/<component>（数据/相对路径配置都落在挂载点）；
#   - 配置文件由 ConfigMap 挂到 /app/<component>/*.toml；
#   - 前端 dist 用 hostPath（scp 到节点即可更新，不重造镜像）；
#   - 对外端口全部 NodePort（k3s 单节点自带 ServiceLB，绑定节点端口）。
#
# 端口规划（节点 IP + NodePort）：
#   gse-server  RPC 7100 -> 30710   Agent 连 {node}:30710
#               HTTP 7101 -> 30711  台账 API + GSE 前端
#   dataserver  SQL HTTP 8081 -> 30881  数据面前端 + 查询
#               Prom 9090  -> 30990  Prom 查询口
#               metrics 9091（容器内自监控，不对外）
#   console     7200 -> 30720      桌面门户
#
# 用法：见同目录 README.md「server 组件上 k3s」一节。
---
apiVersion: v1
kind: Namespace
metadata:
  name: vectorman
---
# gse-server：台账与 Agent 数据面。db 用 hostPath，Pod 重建不丢。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gse-server
  namespace: vectorman
  labels: { app: gse-server }
spec:
  replicas: 1
  strategy: { type: Recreate }        # sqlite 数据库，滚动更新会双写同一个文件，必须 Recreate
  selector: { matchLabels: { app: gse-server } }
  template:
    metadata: { labels: { app: gse-server } }
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: gse-server
          image: vectorman-server:1.2.0-dev
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/gse-server"]
          workingDir: /app/gse-server
          env:
            - name: GSE_SERVER_CONFIG
              value: /app/gse-server/gse-server.toml
          ports:
            - { name: rpc,  containerPort: 7100 }
            - { name: http, containerPort: 7101 }
            - { name: prom, containerPort: 7102 }
          volumeMounts:
            - { name: conf, mountPath: /app/gse-server, readOnly: true }
            - { name: web, mountPath: /app/gse-server/web, readOnly: true }
            - { name: db, mountPath: /app/gse-server/data }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: conf
          configMap: { name: gse-server-conf }
        # GSE 前端 dist（console 应用的产物，与二进制安装的 gse-server/web 同源）
        - name: web
          hostPath: { path: /opt/vectorman-k8s/web/gse, type: Directory }
        - name: db
          hostPath: { path: /opt/vectorman-k8s/gse-server, type: DirectoryOrCreate }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gse-server-conf
  namespace: vectorman
data:
  gse-server.toml: |
    # 前端（GSE 控制台）由节点 hostPath 挂到 ./web；db 落 ./data。
    listen = "0.0.0.0:7100"
    auth_enabled = true
    heartbeat_interval_secs = 30
    heartbeat_timeout_secs = 90
    # 台账 sqlite：落在挂载点（Pod 重建不丢）。
    db = "data/gse-server.db"
    http_enabled = true
    http_listen = "0.0.0.0:7101"
    # 前端 dist 由节点 hostPath 挂进来（见 DaemonSet 下方的 web 卷）。
    http_web_dir = "web"
    metrics_listen = "0.0.0.0:7102"
    dataplane_probe_interval_secs = 30
---
apiVersion: v1
kind: Service
metadata:
  name: gse-server
  namespace: vectorman
spec:
  type: NodePort
  selector: { app: gse-server }
  ports:
    - { name: rpc,  port: 7100, targetPort: rpc,  nodePort: 30710 }
    - { name: http, port: 7101, targetPort: http, nodePort: 30711 }
---
# dataserver：数据面（SQL/Prom HTTP + LogStore/tsink/edge）。data_path 用 hostPath。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataserver
  namespace: vectorman
  labels: { app: dataserver }
spec:
  replicas: 1
  strategy: { type: Recreate }        # sqlite/tsink 同上
  selector: { matchLabels: { app: dataserver } }
  template:
    metadata: { labels: { app: dataserver } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: dataserver
          image: vectorman-server:1.2.0-dev
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/dataserver", "--config", "/app/dataserver/config.toml"]
          workingDir: /app/dataserver
          env:
            - name: DP_DATA_PATH
              value: /app/dataserver/data
          ports:
            - { name: sql,      containerPort: 8081 }
            - { name: prom,     containerPort: 9090 }
            - { name: metrics,  containerPort: 9091 }
          volumeMounts:
            - { name: conf, mountPath: /app/dataserver, readOnly: true }
            - { name: web, mountPath: /app/dataserver/web, readOnly: true }
            - { name: data, mountPath: /app/dataserver/data }
          readinessProbe:
            httpGet: { path: /health, port: sql }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: sql }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: conf
          configMap: { name: dataserver-conf }
        # 前端 dist：scp 到节点 /opt/vectorman-k8s/web/dataplane 后重启 Pod 即可更新。
        - name: web
          hostPath: { path: /opt/vectorman-k8s/web/dataplane, type: Directory }
        - name: data
          hostPath: { path: /opt/vectorman-k8s/dataserver, type: DirectoryOrCreate }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dataserver-conf
  namespace: vectorman
data:
  config.toml: |
    data_path = "/app/dataserver/data"
    ts_retention_days = 30
    ts_retention_enforced = true
    ts_clean_interval_secs = 3600
    apm_agg_interval_secs = 60
    apm_retention_days_default = 3
    apm_max_bytes = 0
    apm_clean_interval_secs = 3600
    apm_ingest_max_batches_per_sec = 0
    apm_min_duration_micros_for_detail = 0

    # 注意：http_web_dir 与 gse_admin_url 是**顶层键**（不进任何 [段]）。
    # 前端 dist 由节点 hostPath 挂到 ./web；同端口托管（SPA 回退 index.html）。
    http_web_dir = "web"

    [sql_http]
    listen = "0.0.0.0:8081"

    [prom_http]
    listen = "0.0.0.0:9090"

    [metrics_http]
    listen = "0.0.0.0:9091"

    [auth]
    enabled = false

    # GSE 管理口（顶层键）：台账联动（live 采集项决定保留范围）走集群内 Service。
    gse_admin_url = "http://gse-server-internal.vectorman.svc:7101"
---
apiVersion: v1
kind: Service
metadata:
  name: dataserver
  namespace: vectorman
spec:
  type: NodePort
  selector: { app: dataserver }
  ports:
    - { name: sql,  port: 8081, targetPort: sql,  nodePort: 30881 }
    - { name: prom, port: 9090, targetPort: prom, nodePort: 30990 }
---
# console：桌面门户（应用目录里登记各组件的 NodePort 地址）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: vectorman
  labels: { app: console }
spec:
  replicas: 1
  selector: { matchLabels: { app: console } }
  template:
    metadata: { labels: { app: console } }
    spec:
      containers:
        - name: console
          image: vectorman-server:1.2.0-dev
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/console"]
          workingDir: /app/console
          env:
            - name: CONSOLE_CONFIG
              value: /app/console/console.toml
          ports:
            - { name: http, containerPort: 7200 }
          volumeMounts:
            # conf 挂到子路径，避免盖住同目录的可写 apps.json
            - { name: conf, mountPath: /app/console/console.toml, subPath: console.toml, readOnly: true }
            - { name: web, mountPath: /app/console/web, readOnly: true }
            - { name: data, mountPath: /app/console }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: conf
          configMap: { name: console-conf }
        - name: web
          hostPath: { path: /opt/vectorman-k8s/web/console, type: Directory }
        - name: data
          hostPath: { path: /opt/vectorman-k8s/console, type: DirectoryOrCreate }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: console-conf
  namespace: vectorman
data:
  console.toml: |
    listen = "0.0.0.0:7200"
    web_dir = "web"
    # 应用目录 JSON（cwd 即可写卷 /app/console，hostPath /opt/vectorman-k8s/console）。
    data_file = "apps.json"
    metrics_listen = "0.0.0.0:7201"
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: vectorman
spec:
  type: NodePort
  selector: { app: console }
  ports:
    - { name: http, port: 7200, targetPort: http, nodePort: 30720 }
---
# 集群内互访的内部 Service（ClusterIP，不占 NodePort）：
# dataserver -> gse-server 的台账联动等。
apiVersion: v1
kind: Service
metadata:
  name: gse-server-internal
  namespace: vectorman
spec:
  type: ClusterIP
  selector: { app: gse-server }
  ports:
    - { name: http, port: 7101, targetPort: http }
