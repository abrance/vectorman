# Vectorman server 侧的 K8s 部署（gse-server / dataserver / console）
#
# 形态：三个 Deployment（单副本，strategy: Recreate）+ 各自 Service + 六条 IngressRoute。
# 镜像是 multi-stage 构建的多功能镜像（web dist 已打进镜像，见 Dockerfile）；
# 数据走节点 hostPath /opt/vectorman-k8s/*（单节点 k3s；多节点时换 PVC/local-path）。
#
# 端口规划（对外唯一入口矩阵，与 Service/IngressRoute 一一对应）：
#   Agent RPC:   {节点IP 或 vectorman.xiaoyxq.top}:30710   -> NodePort 30710（不过 Traefik）
#   GSE 控制台:  https://vectorman.xiaoyxq.top            -> Traefik -> gse-server:7101
#   数据面前端:  https://dataserver.xiaoyxq.top     -> Traefik -> dataserver:8081（同源托管 dist + 全部 API + Prom）
#   桌面门户:    https://console.xiaoyxq.top        -> Traefik -> console:7200
#   metrics:     7102/9091/7201 不建 Service（无消费者）
#
# 注意（都是踩过的坑）：
#   1. IngressRoute 必须每个域名拆两条（web 跳转 + websecure+tls）；
#      合写只生效 websecure，80 端口与 ACME HTTP-01 都 404。
#   2. dataserver 的 http_web_dir / gse_admin_url 是 TOML 顶层键，写进 [sql_http] 段会静默失效。
#   3. 镜像 tag 必须与导入/推送的 tag 逐字一致。
#   4. DNS 先生效再 apply（ACME 签发依赖 HTTP-01 到得了 Traefik）。
---
apiVersion: v1
kind: Namespace
metadata:
  name: vectorman
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: vectorman
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# ── gse-server ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gse-server
  namespace: vectorman
  labels: { app: gse-server }
spec:
  replicas: 1
  strategy: { type: Recreate }        # sqlite，滚动更新会双进程写同一文件
  selector: { matchLabels: { app: gse-server } }
  template:
    metadata: { labels: { app: gse-server } }
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: gse-server
          image: vectorman-server:1.2.0-rc1
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/gse-server"]
          workingDir: /app/gse-server
          env:
            - name: GSE_SERVER_CONFIG
              value: /app/gse-server/gse-server.toml
          ports:
            - { name: rpc,  containerPort: 7100 }
            - { name: http, containerPort: 7101 }
          volumeMounts:
            - { name: conf, mountPath: /app/gse-server/gse-server.toml, subPath: gse-server.toml, readOnly: true }
            - { name: db, mountPath: /app/gse-server/data }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: conf
          configMap: { name: gse-server-conf }
        - name: db
          hostPath: { path: /opt/vectorman-k8s/gse-server, type: DirectoryOrCreate }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gse-server-conf
  namespace: vectorman
data:
  gse-server.toml: |
    listen = "0.0.0.0:7100"
    auth_enabled = true
    heartbeat_interval_secs = 30
    heartbeat_timeout_secs = 90
    db = "data/gse-server.db"
    http_enabled = true
    http_listen = "0.0.0.0:7101"
    # 前端 dist 在镜像内 /app/web/gse（绝对路径，无需挂载）
    http_web_dir = "/app/web/gse"
    metrics_listen = "0.0.0.0:7102"
    dataplane_probe_interval_secs = 30
---
apiVersion: v1
kind: Service
metadata:
  name: gse-server
  namespace: vectorman
spec:
  type: NodePort
  selector: { app: gse-server }
  ports:
    - { name: rpc,  port: 7100, targetPort: rpc,  nodePort: 30710 }
    - { name: http, port: 7101, targetPort: http, nodePort: 30711 }
---
apiVersion: v1
kind: Service
metadata:
  name: gse-server-internal
  namespace: vectorman
spec:
  type: ClusterIP
  selector: { app: gse-server }
  ports:
    - { name: http, port: 7101, targetPort: http }
---
# ── dataserver ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataserver
  namespace: vectorman
  labels: { app: dataserver }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: dataserver } }
  template:
    metadata: { labels: { app: dataserver } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: dataserver
          image: vectorman-server:1.2.0-rc1
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/dataserver", "--config", "/app/dataserver/config.toml"]
          workingDir: /app/dataserver
          env:
            - name: DP_DATA_PATH
              value: /app/dataserver/data
          ports:
            - { name: sql,      containerPort: 8081 }
            - { name: prom,     containerPort: 9090 }
          volumeMounts:
            - { name: conf, mountPath: /app/dataserver/config.toml, subPath: config.toml, readOnly: true }
            - { name: data, mountPath: /app/dataserver/data }
          readinessProbe:
            httpGet: { path: /health, port: sql }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: sql }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: conf
          configMap: { name: dataserver-conf }
        - name: data
          hostPath: { path: /opt/vectorman-k8s/dataserver, type: DirectoryOrCreate }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dataserver-conf
  namespace: vectorman
data:
  config.toml: |
    data_path = "/app/dataserver/data"
    ts_retention_days = 30
    ts_retention_enforced = true
    ts_clean_interval_secs = 3600
    apm_agg_interval_secs = 60
    apm_retention_days_default = 3
    apm_max_bytes = 0
    apm_clean_interval_secs = 3600
    apm_ingest_max_batches_per_sec = 0
    apm_min_duration_micros_for_detail = 0

    # 顶层键（不进任何 [段]！）：http_web_dir 同端口托管前端（镜像内 /app/web/dataplane）；gse_admin_url 台账联动。
    http_web_dir = "/app/web/dataplane"
    gse_admin_url = "http://gse-server-internal.vectorman.svc:7101"

    [sql_http]
    listen = "0.0.0.0:8081"

    [prom_http]
    listen = "0.0.0.0:9090"

    [metrics_http]
    listen = "0.0.0.0:9091"

    [auth]
    enabled = false
---
apiVersion: v1
kind: Service
metadata:
  name: dataserver
  namespace: vectorman
spec:
  type: NodePort
  selector: { app: dataserver }
  ports:
    - { name: sql,  port: 8081, targetPort: sql,  nodePort: 30881 }
    - { name: prom, port: 9090, targetPort: prom, nodePort: 30990 }
---
# ── console ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: vectorman
  labels: { app: console }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: console } }
  template:
    metadata: { labels: { app: console } }
    spec:
      containers:
        - name: console
          image: vectorman-server:1.2.0-rc1
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/console"]
          workingDir: /app/console
          env:
            - name: CONSOLE_CONFIG
              value: /app/console/console.toml
          ports:
            - { name: http, containerPort: 7200 }
          volumeMounts:
            - { name: conf, mountPath: /app/console/console.toml, subPath: console.toml, readOnly: true }
            - { name: data, mountPath: /app/console }
      volumes:
        - name: conf
          configMap: { name: console-conf }
        - name: data
          hostPath: { path: /opt/vectorman-k8s/console, type: DirectoryOrCreate }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: console-conf
  namespace: vectorman
data:
  console.toml: |
    listen = "0.0.0.0:7200"
    web_dir = "/app/web/console"
    data_file = "apps.json"
    metrics_listen = "0.0.0.0:7201"
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: vectorman
spec:
  type: NodePort
  selector: { app: console }
  ports:
    - { name: http, port: 7200, targetPort: http, nodePort: 30720 }
---
# ── 公网入口（六条 IngressRoute：每域名两条，见文件头注释 1）───────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gse-server-web
  namespace: vectorman
spec:
  entryPoints: [web]
  routes:
    - match: Host(`vectorman.xiaoyxq.top`)
      kind: Rule
      middlewares: [{ name: redirect-https }]
      services:
        - { name: gse-server, port: 7101 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gse-server-tls
  namespace: vectorman
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`vectorman.xiaoyxq.top`)
      kind: Rule
      services:
        - { name: gse-server, port: 7101 }
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dataserver-web
  namespace: vectorman
spec:
  entryPoints: [web]
  routes:
    - match: Host(`dataserver.xiaoyxq.top`)
      kind: Rule
      middlewares: [{ name: redirect-https }]
      services:
        - { name: dataserver, port: 8081 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dataserver-tls
  namespace: vectorman
spec:
  entryPoints: [websecure]
  routes:
    # 整域名全路径给同一个 Service（A3 同源约束：/v1/...、/api/v1/...、/assets/... 同端口）。
    - match: Host(`dataserver.xiaoyxq.top`)
      kind: Rule
      services:
        - { name: dataserver, port: 8081 }
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: console-web
  namespace: vectorman
spec:
  entryPoints: [web]
  routes:
    - match: Host(`console.xiaoyxq.top`)
      kind: Rule
      middlewares: [{ name: redirect-https }]
      services:
        - { name: console, port: 7200 }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: console-tls
  namespace: vectorman
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`console.xiaoyxq.top`)
      kind: Rule
      services:
        - { name: console, port: 7200 }
  tls:
    certResolver: letsencrypt
