[package]
name = "vmctl"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
# `data` 子命名空间复用 `dpc` 的实现（同一份命令定义与错误口径），不复制查询逻辑。
dpc = { path = "../dpc" }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = "2"
urlencoding = "2"
vectorman-version.workspace = true

[dev-dependencies]
# IT-VMCTL-01 与其它场景共用 `free_port` / 资源生成器，不再各自复制。
vectorman-test-support = { path = "../../crates/test-support" }

[features]
# 让二进制的测试模块也能复用 lib 的脚本化 transport（Mock）。
test-support = []
