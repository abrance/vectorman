[package]
name = "dataserver"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dataplane-core.workspace = true
dataplane-file.workspace = true
dataplane-kv.workspace = true
dataplane-sql.workspace = true
dataplane-ts.workspace = true
dataplane-log.workspace = true
dataplane-ingest.workspace = true
dataplane-apm.workspace = true
dataplane-adapter-redis = { path = "../../crates/dataplane-adapter-redis" }
dataplane-adapter-victoriametrics = { path = "../../crates/dataplane-adapter-victoriametrics" }
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
axum = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
tower-http = { version = "0.6", features = ["fs"] }
ureq = "2"
vectorman-version.workspace = true
vectorman-metrics.workspace = true
async-trait.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
gse-server-core = { path = "../../crates/gse-server-core" }
# 回放对比基准要直读 tsink（源 WAL），只在测试里用。
tsink = { git = "https://github.com/abrance/tsink", rev = "c7a8754cbfb23db15b7550b51e2587dd9f11808e" }
